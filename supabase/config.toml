# Supabase CLI — конфигурация проекта VK AI Manager
# Документация: https://supabase.com/docs/guides/local-development/cli/config

project_id = "vk-ai-manager"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "12MiB"

[auth]
enabled = true
site_url = "https://andrey1904-dev.github.io/VKBablo/"
additional_redirect_urls = [
  "https://andrey1904-dev.github.io/VKBablo/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**"
]
jwt_expiry = 3600
enable_signup = false
enable_confirmations = false

[auth.email]
enable_signup = false
double_confirm_changes = true

[functions.vk-ai-api]
verify_jwt = false

[functions.vk-ai-worker]
verify_jwt = false

[analytics]
enabled = false
