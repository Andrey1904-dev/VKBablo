name: Deploy demo frontend to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Source is a one-time repository setting, NOT a per-deployment mutation.
      # Rewriting it on every push raced the dynamic Jekyll publisher.
      - name: Require a single Pages source (GitHub Actions)
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pages } = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (pages.build_type !== 'workflow') {
              core.setFailed('Settings → Pages → Build and deployment → Source must be GitHub Actions, not Deploy from a branch. Do not publish the repository root through Jekyll.');
            }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Browser fault-injection and owner-creation tests always run against the isolated demo backend.
      - name: Build demo artifact for browser smoke
        run: VITE_BACKEND_MODE=demo npm run build:pages
      - run: npx playwright install --with-deps chromium webkit
      - name: Render demo artifact (desktop and iPhone WebKit)
        run: npm run test:browser
      - name: Reject local API mode on static Pages hosting
        run: |
          if [ "$VITE_BACKEND_MODE" = "local" ]; then
            echo "VITE_BACKEND_MODE=local requires the Node API and cannot be used on GitHub Pages."
            exit 1
          fi
        env:
          VITE_BACKEND_MODE: ${{ vars.VITE_BACKEND_MODE || 'auto' }}
      # Only public Supabase URL/anon values may enter the client bundle. Empty vars keep demo mode.
      - name: Build Pages artifact for configured backend
        run: npm run build:pages
        env:
          VITE_BACKEND_MODE: ${{ vars.VITE_BACKEND_MODE || 'auto' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-build-browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Render the deployed revision, not just HTTP 200
        run: npm run test:browser
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          PAGES_EXPECTED_SHA: ${{ github.sha }}
          PAGES_BACKEND_MODE: ${{ vars.VITE_BACKEND_MODE || 'auto' }}
          PAGES_HAS_SUPABASE: ${{ vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_ANON_KEY != '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-live-browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
