name: Deploy demo frontend to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_BACKEND_MODE: demo
      # Pages может быть настроен на «деплой из ветки» (legacy) — переводим на деплой
      # через GitHub Actions. Если уже workflow-режим, шаг ничего не меняет.
      - name: Switch Pages source to GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.updateInformationAboutPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow',
              });
              core.info('Pages build_type=workflow');
            } catch (e) {
              core.warning(`Не удалось переключить источник Pages: ${e.message}. Если деплой упадёт — включите Source: GitHub Actions в Settings → Pages.`);
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Проверка живого сайта
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          sleep 8
          html="$(curl -fsSL "$url")" || { echo "Не удалось загрузить $url"; exit 1; }
          echo "$html" | grep -q 'assets/index-.*\.js' || { echo "Сайт не отдаёт собранный бандл. HTML:"; echo "$html" | head -30; exit 1; }
          asset="$(echo "$html" | grep -o 'assets/index-[^"]*\.js' | head -1)"
          curl -fsSL -o /dev/null "$url$asset" || { echo "Бандл недоступен: $url$asset"; exit 1; }
          echo "✅ Сайт отдаёт собранный интерфейс: $url$asset"
