name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Изоморфное ядро (shared/*) обязано быть синхронно с копией для Edge Functions.
      - run: node scripts/sync-shared.mjs --check

      - name: Типы (frontend + локальный стенд)
        run: npm run typecheck

      - name: Тесты (одобрение, хэш версий, планировщик)
        run: npm test

      - name: Сборка фронтенда
        run: npm run build

      - name: Production GitHub Pages build
        run: npm run build:pages

      - run: npx playwright install --with-deps chromium webkit

      - name: Production render (desktop and iPhone WebKit)
        run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
